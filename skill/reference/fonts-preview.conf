<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Preview-only substitution: the deck keeps "Mark Pro"/"Mark Pro Light".
     Used automatically by scripts/render_deck.py (sets it as an absolute path). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" compare="eq"><string>Mark Pro Light</string></test>
    <test name="weight" compare="less"><const>bold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>Outfit</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>light</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Mark Pro Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Outfit</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>semibold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Mark Pro</string></test>
    <test name="weight" compare="less"><const>bold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>Outfit</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Mark Pro</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Outfit</string></edit>
  </match>
</fontconfig>
